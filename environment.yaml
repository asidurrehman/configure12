# Conda environment for CONFIGURE v1.2
#   conda env create -f environment.yaml
#   conda activate configure
#
# numpy < 2 and pandas < 3 keep results identical to the published study
# (see requirements.txt).
name: configure
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy >=1.23,<2
  - pandas >=1.5,<3
  - geopandas >=0.12
  - shapely >=2.0
  - rtree >=1.0
  - rasterio >=1.3
  - matplotlib >=3.6
  - pyyaml >=6.0
  - pytest
